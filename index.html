<style>

<script type="text/babel">

const F="#e91e8c",F2="#ff69b4",FL="#fff0f7",FD="#c2177a";
const PASS="647881867",AWA="34647881867",SK="miranails_citas";

const SERVICIOS=[
  {cat:"💅 Manicura",items:[
    {name:"Manicura básica",price:"18€",dur:"45 min",desc:"Limado, cutícula y esmaltado clásico"},
    {name:"Manicura semipermanente",price:"25€",dur:"60 min",desc:"Duración de hasta 3 semanas"},

    {name:"Pedicura semipermanente",price:"30€",dur:"70 min",desc:"Semipermanente en pies, larga duración"},

  {cat:"🎨 Nail Art",items:[
    {name:"Diseño sencillo",price:"+8€",dur:"+20 min",desc:"Líneas, puntos o degradado básico"},
    {name:"Diseño medio",price:"+15€",dur:"+30 min",desc:"Flores, mármol o efectos especiales"},
    {name:"Diseño complejo",price:"+25€",dur:"+45 min",desc:"Diseños personalizados y detallados"},

  {q:"¿Cómo puedo pagar?",a:"💳 Aceptamos efectivo, tarjeta y Bizum. ¡Todas las opciones!"},

const loadC=()=>{try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch{}return[];};
const saveC=d=>{try{localStorage.setItem(SK,JSON.stringify(d));}catch{}};

const notif=c=>{if("Notification"in window&&Notification.permission==="granted")new Notification("💅 Miranails — Nueva cita",{body:`${c.nombre} · ${c.servicio} · ${c.fecha} a las ${c.hora}`});};

function BotMsg({children}){
  return(
    <div style={{marginBottom:8,display:"flex",alignItems:"flex-end",gap:8}}>
      <div style={{width:32,height:32,borderRadius:"50%",background:`linear-gradient(135deg,${F},${F2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>💅</div>
      <div style={{background:"#fff",borderRadius:"18px 18px 18px 4px",padding:"12px 16px",maxWidth:"80%",fontSize:14,lineHeight:1.5,boxShadow:"0 1px 4px #0001",color:"#1a1a1a"}}>{children}</div>
    </div>
  );
}
function UserMsg({children}){
  return(
    <div style={{marginBottom:8,display:"flex",justifyContent:"flex-end"}}>
      <div style={{background:`linear-gradient(135deg,${F},${F2})`,borderRadius:"18px 18px 4px 18px",padding:"12px 16px",maxWidth:"80%",fontSize:14,color:"#fff",lineHeight:1.5}}>{children}</div>
    </div>
  );
}
function Btns({options,onSelect,color}){
  const c=color||F;
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12,marginLeft:40}}>
      {options.map(o=>(
        <button key={o.label||o} onClick={()=>onSelect(o)}
          style={{padding:"8px 14px",borderRadius:99,border:`2px solid ${c}`,background:"#fff",color:c,fontSize:13,fontWeight:600,cursor:"pointer"}}

          onMouseOut={e=>{e.currentTarget.style.background="#fff";e.currentTarget.style.color=c;}}>

    </div>
  );
}

function AdminPanel({onExit}){
  const[citas,setCitas]=useState(loadC);
  const[filtro,setFiltro]=useState("todas");
  const[buscar,setBuscar]=useState("");

  useEffect(()=>{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();},[]);

  const actualizar=(id,estado)=>{const n=citas.map(c=>c.id===id?{...c,estado}:c);setCitas(n);saveC(n);};

  const abrirWA=(cita,tipo)=>{
    const msg=tipo==="aceptar"
      ?`Hola ${cita.nombre} 💅 Tu cita en *Miranails* ha sido *confirmada* ✅\n\n📅 *Fecha:* ${cita.fecha}\n🕐 *Hora:* ${cita.hora}\n💅 *Servicio:* ${cita.servicio}\n\n¡Te esperamos! Si necesitas cambiarla avísanos con 24h. 🩷`
      :`Hola ${cita.nombre}, lamentablemente no podemos confirmar tu cita del ${cita.fecha} a las ${cita.hora}. Disculpa las molestias, contáctanos para buscar otra fecha. Miranails 💅`;
    window.open(`https://wa.me/${(cita.telefono||"").replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`,"_blank");
  };

  const recordatorio=cita=>{
    const msg=`Hola ${cita.nombre} 💅 Te recordamos tu cita en *Miranails* mañana.\n\n📅 *Fecha:* ${cita.fecha}\n🕐 *Hora:* ${cita.hora}\n💅 *Servicio:* ${cita.servicio}\n\n¡Te esperamos! 🩷`;
    window.open(`https://wa.me/${(cita.telefono||"").replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`,"_blank");
  };

  const cf=citas.filter(c=>filtro==="todas"||c.estado===filtro).filter(c=>!buscar||c.nombre?.toLowerCase().includes(buscar.toLowerCase())||c.servicio?.toLowerCase().includes(buscar.toLowerCase())).sort((a,b)=>b.id-a.id);
  const cnt={pendiente:citas.filter(c=>c.estado==="pendiente").length,aceptada:citas.filter(c=>c.estado==="aceptada").length,rechazada:citas.filter(c=>c.estado==="rechazada").length};

  return(
    <div style={{minHeight:"100vh",background:"#fdf2f8",fontFamily:"'Segoe UI',sans-serif"}}>
      <div style={{background:`linear-gradient(135deg,${F},${F2})`,padding:"20px 20px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

          <div style={{fontSize:22,fontWeight:800,color:"#fff"}}>💅 Miranails</div>
          <div style={{fontSize:13,color:"#ffffffcc"}}>Panel de administración</div>
        </div>
        <button onClick={onExit} style={{background:"#fff2",border:"1px solid #fff4",borderRadius:10,color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>Salir</button>
      </div>
      <div style={{padding:16,maxWidth:600,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
          {[{label:"Pendientes",val:cnt.pendiente,color:"#f59e0b",bg:"#fffbeb"},{label:"Aceptadas",val:cnt.aceptada,color:"#22c55e",bg:"#f0fdf4"},{label:"Rechazadas",val:cnt.rechazada,color:"#ef4444",bg:"#fef2f2"}].map(s=>(
            <div key={s.label} style={{background:s.bg,border:`1px solid ${s.color}33`,borderRadius:14,padding:"12px 10px",textAlign:"center"}}>
              <div style={{fontSize:24,fontWeight:800,color:s.color}}>{s.val}</div>
              <div style={{fontSize:11,color:"#666"}}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          {["todas","pendiente","aceptada","rechazada"].map(f=>(
            <button key={f} onClick={()=>setFiltro(f)} style={{padding:"6px 14px",borderRadius:99,border:`2px solid ${F}`,background:filtro===f?F:"#fff",color:filtro===f?"#fff":F,fontSize:12,fontWeight:600,cursor:"pointer"}}>
              {f==="todas"?"Todas":f.charAt(0).toUpperCase()+f.slice(1)+"s"}
            </button>
          ))}
          <button onClick={()=>setCitas(loadC())} style={{padding:"6px 14px",borderRadius:99,border:"2px solid #94a3b8",background:"#fff",color:"#64748b",fontSize:12,cursor:"pointer"}}>🔄 Actualizar</button>
        </div>
        <input value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="🔍 Buscar por nombre o servicio..." style={{width:"100%",border:"1.5px solid #f0c0de",borderRadius:12,padding:"10px 14px",fontSize:13,marginBottom:16,outline:"none",boxSizing:"border-box",background:"#fff"}}/>
        {cf.length===0
          ?<div style={{textAlign:"center",color:"#c2177a99",padding:40,fontSize:15}}>No hay citas {filtro!=="todas"?filtro+"s":""} aún 💅</div>
          :cf.map(c=>(
            <div key={c.id} style={{background:"#fff",borderRadius:18,padding:16,marginBottom:12,boxShadow:"0 2px 12px #e91e8c11",borderLeft:`4px solid ${c.estado==="aceptada"?"#22c55e":c.estado==="rechazada"?"#ef4444":"#f59e0b"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div>
                  <div style={{fontWeight:700,fontSize:16}}>👤 {c.nombre}</div>
                  <div style={{fontSize:13,color:F,fontWeight:600,marginTop:2}}>💅 {c.servicio} — {c.precio}</div>
                </div>
                <div style={{fontSize:11,padding:"4px 10px",borderRadius:99,background:c.estado==="aceptada"?"#dcfce7":c.estado==="rechazada"?"#fee2e2":"#fef3c7",color:c.estado==="aceptada"?"#16a34a":c.estado==="rechazada"?"#dc2626":"#d97706",fontWeight:700}}>
                  {c.estado==="aceptada"?"✅ Aceptada":c.estado==="rechazada"?"❌ Rechazada":"⏳ Pendiente"}
                </div>
              </div>
              <div style={{fontSize:13,color:"#555",display:"flex",flexWrap:"wrap",gap:"6px 16px",marginBottom:12}}>
                <span>📅 {c.fecha}</span><span>🕐 {c.hora}</span><span>📞 {c.telefono}</span>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {c.estado==="pendiente"&&<>
                  <button onClick={()=>{actualizar(c.id,"aceptada");abrirWA(c,"aceptar");}} style={{flex:1,padding:"8px 12px",borderRadius:10,border:"none",background:"#22c55e",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>✅ Aceptar + WA</button>
                  <button onClick={()=>{actualizar(c.id,"rechazada");abrirWA(c,"rechazar");}} style={{flex:1,padding:"8px 12px",borderRadius:10,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>❌ Rechazar + WA</button>
                </>}
                {c.estado==="aceptada"&&<>
                  <button onClick={()=>recordatorio(c)} style={{flex:1,padding:"8px 12px",borderRadius:10,border:`2px solid ${F}`,background:"#fff",color:F,fontWeight:700,cursor:"pointer",fontSize:13}}>⏰ Recordatorio WA</button>
                  <button onClick={()=>abrirWA(c,"aceptar")} style={{padding:"8px 12px",borderRadius:10,border:"2px solid #22c55e",background:"#fff",color:"#22c55e",fontWeight:700,cursor:"pointer",fontSize:13}}>📱 WA</button>
                </>}
                {c.estado==="rechazada"&&<button onClick={()=>actualizar(c.id,"pendiente")} style={{flex:1,padding:"8px 12px",borderRadius:10,border:`2px solid ${F}`,background:"#fff",color:F,fontWeight:700,cursor:"pointer",fontSize:12}}>↩️ Reabrir</button>}
              </div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

function AdminLogin({onLogin,onBack}){
  const[pass,setPass]=useState("");
  const[err,setErr]=useState(false);
  const check=()=>{if(pass===PASS)onLogin();else{setErr(true);setTimeout(()=>setErr(false),1500);}};
  return(
    <div style={{minHeight:"100vh",background:`linear-gradient(135deg,${FL},#fce4f3)`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',sans-serif"}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,width:300,boxShadow:`0 8px 40px ${F}22`,textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:8}}>🔐</div>
        <div style={{fontSize:20,fontWeight:800,color:FD,marginBottom:4}}>Panel Admin</div>
        <div style={{fontSize:13,color:"#c2177a99",marginBottom:24}}>Miranails</div>
        <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&check()} placeholder="Contraseña..." style={{width:"100%",border:`1.5px solid ${err?"#ef4444":F}`,borderRadius:12,padding:"12px 16px",fontSize:15,outline:"none",boxSizing:"border-box",textAlign:"center",marginBottom:8}}/>
        {err&&<div style={{color:"#ef4444",fontSize:13,marginBottom:8}}>Contraseña incorrecta ❌</div>}
        <button onClick={check} style={{width:"100%",padding:14,background:`linear-gradient(135deg,${F},${F2})`,border:"none",borderRadius:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:10}}>Entrar</button>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#c2177a99",fontSize:13,cursor:"pointer"}}>← Volver al chat</button>
      </div>
    </div>
  );
}

  const goWelcome=async()=>{
    setStep("loading");setMsgs([]);setReady(false);
    await addBot(React.createElement("span",null,"¡Hola! 👋 Bienvenida a ",React.createElement("b",{style:{color:F}},"Miranails")," 💅 Soy tu asistente virtual. ¿En qué puedo ayudarte?"),200);

  const handleInput=()=>{
    if(!input.trim())return;
    const val=input.trim();setInput("");setInputMode(false);addUser(val);
    if(step==="cita_nombre"){setCita(c=>({...c,nombre:val}));setStep("cita_fecha");setInputMode(true);setInputLabel("Escribe la fecha (ej: lunes 19 de mayo)...");}

      React.createElement(Btns,{options:[{label:"⬅️ Volver"}],onSelect:()=>setStep("main"),color:"#888"})

        React.createElement(Btns,{options:[{label:"📅 Reservar"},{label:"⬅️ Volver"}],onSelect:o=>{if(o.label.includes("Reservar")){setStep("cita_cat");setCita({});}else setStep("servicios");}})
